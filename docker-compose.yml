# Local Postgres. `db` keeps its data in a volume; `db-test` runs in memory
# with disk syncing off, because test data is thrown away (M0 grill).
# The fixed project name makes `docker compose` run inside a git worktree reach
# these same containers instead of starting a second set on the same ports (D45).
name: ecommerce-supplement-store

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 2s
      timeout: 3s
      retries: 30

  db-test:
    image: postgres:18
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store_test
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store_test"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
